[project]
name = "steme"
version = "0.2.0"
description = "Semantic Transformation & Evaluation Mapping Engine — embedding-based semantic similarity, NLI classification, and emotion detection."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENCE" }
dependencies = [
    "sentence-transformers",
    "scikit-learn",
    "numpy",
    "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]
bench = ["psutil", "pandas", "matplotlib"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["steme_core"]
